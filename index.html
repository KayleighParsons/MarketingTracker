<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zip-Clip Department Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Oswald:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ---------- Tokens ---------- */
:root {
  --orange: #FF8200; --orange-ink: #B85C00; --orange-soft: #FFF1E3;
  --charcoal: #3C3A3C;
  --bg: #F4F3F2; --surface: #FFFFFF; --surface-2: #FAF9F8; --line: #E4E2E0; --line-strong: #CFCCC9;
  --text: #2B292B; --text-2: #5C595C; --text-3: #8A868A;
  --good: #1F7A4D; --good-bg: #E5F4EC; --warn: #9A6100; --warn-bg: #FFF4D6;
  --bad: #B3261E; --bad-bg: #FCE8E6; --info: #1F5FA8; --info-bg: #E6EFFA;
  --s-linkedin: #2a78d6; --s-instagram: #eb6834; --s-facebook: #6250d6; --s-tiktok: #1baf7a; --s-youtube: #eda100; --s-other: #8A868A;
  --shadow: 0 1px 2px rgba(60,58,60,.06), 0 2px 8px rgba(60,58,60,.05);
  --radius: 10px;
  --font: Prometo, "Exo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --orange: #FF9426; --orange-ink: #FFB066; --orange-soft: #3A2A1A;
    --bg: #1C1B1C; --surface: #262426; --surface-2: #2C2A2C; --line: #3A383A; --line-strong: #4A474A;
    --text: #F0EEEC; --text-2: #C9C5C2; --text-3: #9A9592;
    --good: #5CC98E; --good-bg: #1E3328; --warn: #E8B44A; --warn-bg: #3A2F17; --bad: #F2867E; --bad-bg: #3D2220;
    --info: #7EB2F0; --info-bg: #1D2B3D;
    --s-linkedin: #3987e5; --s-instagram: #d95926; --s-facebook: #9085e9; --s-tiktok: #199e70; --s-youtube: #c98500;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --orange: #FF9426; --orange-ink: #FFB066; --orange-soft: #3A2A1A;
  --bg: #1C1B1C; --surface: #262426; --surface-2: #2C2A2C; --line: #3A383A; --line-strong: #4A474A;
  --text: #F0EEEC; --text-2: #C9C5C2; --text-3: #9A9592;
  --good: #5CC98E; --good-bg: #1E3328; --warn: #E8B44A; --warn-bg: #3A2F17; --bad: #F2867E; --bad-bg: #3D2220;
  --info: #7EB2F0; --info-bg: #1D2B3D;
  --s-linkedin: #3987e5; --s-instagram: #d95926; --s-facebook: #9085e9; --s-tiktok: #199e70; --s-youtube: #c98500;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--orange-ink); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
.hidden { display: none !important; }
.muted { color: var(--text-2); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Layout ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--charcoal); color: #fff; }
.topbar-inner { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--orange); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.brand small { display: block; font-weight: 400; opacity: .75; font-size: 11px; }
.topbar .spacer { flex: 1; }
.sync { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 6px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: #5CC98E; }
.sync.busy .dot { background: var(--orange); }
.sync.err .dot { background: #F2867E; }
.tb-btn { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.tb-btn:hover { background: rgba(255,255,255,.18); }
.nav { max-width: 1320px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
.nav button { background: none; border: 0; color: rgba(255,255,255,.75); padding: 10px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500; }
.nav button.on { color: #fff; border-bottom-color: var(--orange); }
.nav .badge { background: var(--orange); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
main { max-width: 1320px; margin: 0 auto; padding: 18px 16px 60px; }

.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-head h1 { font-size: 22px; }
.page-head .sub { color: var(--text-2); }
.page-head .spacer { flex: 1; }

.filterbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }
:root[data-theme="dark"] .chip.on { background: var(--orange); border-color: var(--orange); color: #1C1B1C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.on { background: var(--orange); border-color: var(--orange); color: #1C1B1C; } }
.chip .count { font-size: 11px; opacity: .8; }

.grid { display: grid; gap: 14px; }
.g-6 { grid-template-columns: repeat(6, minmax(0,1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (max-width: 1100px) { .g-6 { grid-template-columns: repeat(3, minmax(0,1fr)); } .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 760px) { .g-6, .g-3, .g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 520px) { .g-6, .g-4, .g-3, .g-2 { grid-template-columns: minmax(0,1fr); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 15px; margin-bottom: 4px; }
.card .note { color: var(--text-2); font-size: 12px; margin: 0 0 10px; }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.card-head .spacer { flex: 1; }
.section { margin-top: 18px; }

.stat { padding: 12px 14px; cursor: default; }
.stat.click { cursor: pointer; }
.stat.click:hover { border-color: var(--orange); }
.stat .label { color: var(--text-2); font-size: 12px; font-weight: 500; }
.stat .value { font-size: 28px; font-weight: 700; line-height: 1.1; margin-top: 4px; }
.stat .meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.stat.alert .value { color: var(--bad); }
.stat.warnish .value { color: var(--warn); }

/* ---------- Buttons & forms ---------- */
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 7px 12px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.primary:hover { filter: brightness(.95); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--orange-ink); cursor: pointer; padding: 0; font-weight: 500; }
input[type=text], input[type=password], input[type=date], input[type=number], input[type=email], input[type=search], select, textarea {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 7px 9px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
label.f > input, label.f > select, label.f > textarea { margin-top: 4px; font-weight: 400; color: var(--text); }
.frow { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 12px; }
.frow.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
@media (max-width: 560px) { .frow, .frow.three { grid-template-columns: minmax(0,1fr); } }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.form-error { background: var(--bad-bg); color: var(--bad); border-radius: 7px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar input[type=search] { max-width: 260px; }
.toolbar select { width: auto; }

/* ---------- Pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.info { background: var(--info-bg); color: var(--info); border-color: transparent; }
.pill.brand { background: var(--orange-soft); color: var(--orange-ink); border-color: transparent; }
.who { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--charcoal); color: #fff; font-size: 10.5px; font-weight: 700; flex: none; }
.who.none { background: var(--bad-bg); color: var(--bad); }

/* ---------- Job list ---------- */
.group-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin: 16px 0 6px; color: var(--text-2); }
.group-title .n { font-weight: 500; color: var(--text-3); }
.jobs { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.job { display: grid; grid-template-columns: 28px 26px minmax(0,1fr) 150px 120px 90px 30px; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.job:first-child { border-top: 0; }
.job:hover { background: var(--surface-2); }
.job.member { grid-template-columns: minmax(0,1fr) 150px 120px 90px 30px; }
.job .t { min-width: 0; }
.job .t button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 600; color: var(--text); }
.job .t button:hover { color: var(--orange-ink); }
.job .meta { font-size: 12px; color: var(--text-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.job select.status { padding: 4px 6px; font-size: 12.5px; }
.job .due { font-size: 12.5px; }
.job .due.over, td.due.over { color: var(--bad); font-weight: 600; }
.job .hrs { font-size: 12px; color: var(--text-2); text-align: right; }
.job.done .t button { color: var(--text-3); text-decoration: line-through; }
@media (max-width: 860px) {
  .job, .job.member { grid-template-columns: 26px minmax(0,1fr) 110px; }
  .job.member { grid-template-columns: minmax(0,1fr) 110px; }
  .job .sel, .job .hrs, .job .more { display: none; }
  .job .due { grid-column: 2 / 3; }
  .job.member .due { grid-column: 1 / 2; }
}
.empty { padding: 26px; text-align: center; color: var(--text-2); }
.bulkbar { position: sticky; bottom: 12px; z-index: 15; background: var(--charcoal); color: #fff; border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 6px 20px rgba(0,0,0,.2); margin-top: 12px; }
.bulkbar select { width: auto; color: var(--text); }

/* ---------- Tables ---------- */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.num, table.t th.num { text-align: right; }

/* ---------- Person cards ---------- */
.pcard { cursor: pointer; }
.pcard:hover { border-color: var(--orange); }
.pcard .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pcard .top .who { width: 34px; height: 34px; font-size: 12px; }
.pcard .name { font-weight: 700; }
.pcard .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.pcard .nums div { background: var(--surface-2); border-radius: 7px; padding: 6px 2px; }
.pcard .nums b { display: block; font-size: 18px; }
.pcard .nums span { font-size: 10.5px; color: var(--text-3); }
.pcard .nums .bad b { color: var(--bad); }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--orange); border-radius: 4px; }
.bar.over > i { background: var(--bad); }
.pcard .cap { margin-top: 10px; font-size: 12px; color: var(--text-2); }
.pcard .cap .bar { margin-top: 4px; }
.pcard .flags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Health list ---------- */
.health li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.health li:first-child { border-top: 0; }
.health ul { list-style: none; padding: 0; margin: 0; }
.health .n { font-weight: 700; min-width: 32px; text-align: right; font-size: 16px; }
.health .n.zero { color: var(--good); }
.health .d { flex: 1; }
.health .d small { display: block; color: var(--text-3); }

/* ---------- Skills matrix ---------- */
.matrix th.p { text-align: center; min-width: 110px; }
.matrix td.lvl { text-align: center; cursor: default; }
.matrix td.lvl.edit { cursor: pointer; }
.matrix td.lvl.edit:hover { background: var(--surface-2); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.dots i.f { background: var(--orange); border-color: var(--orange); }
.dots i.t { border-color: var(--charcoal); border-style: dashed; }
:root[data-theme="dark"] .dots i.t { border-color: var(--text-2); }
.lvl .sub { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px; }
.lvl.gap .sub { color: var(--warn); font-weight: 600; }
.area-row td { background: var(--surface-2); font-weight: 700; font-size: 12px; color: var(--text-2); }

/* ---------- Goals ---------- */
.goal { border: 1px solid var(--line); border-radius: 9px; padding: 12px; background: var(--surface); }
.goal h3 { font-size: 14px; }
.goal .bar { margin: 8px 0 6px; }
.goal .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-2); }

/* ---------- Capacity ---------- */
.capgrid { border-collapse: separate; border-spacing: 3px; font-size: 12px; }
.capgrid th { font-weight: 600; color: var(--text-3); font-size: 11px; padding: 2px 4px; text-align: center; white-space: nowrap; }
.capgrid th.rowh { text-align: left; color: var(--text); font-size: 13px; min-width: 120px; }
.capgrid td { width: 46px; height: 38px; text-align: center; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); line-height: 1.1; }
.capgrid td.off { background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 4px, var(--line) 4px, var(--line) 5px); color: var(--text-3); }
.capgrid td.l1 { background: #FFF1E3; } .capgrid td.l2 { background: #FFD9B0; } .capgrid td.l3 { background: #FFB466; }
.capgrid td.over { background: var(--bad-bg); color: var(--bad); font-weight: 700; border-color: var(--bad); }
:root[data-theme="dark"] .capgrid td.l1 { background: #3A2A1A; } :root[data-theme="dark"] .capgrid td.l2 { background: #5A3A16; } :root[data-theme="dark"] .capgrid td.l3 { background: #8A5410; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .capgrid td.l1 { background: #3A2A1A; } :root:not([data-theme="light"]) .capgrid td.l2 { background: #5A3A16; } :root:not([data-theme="light"]) .capgrid td.l3 { background: #8A5410; } }
.capgrid td b { display: block; font-size: 12.5px; }
.capgrid td span { font-size: 10px; opacity: .8; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 8px; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }

/* ---------- Charts ---------- */
.chart-box { position: relative; height: 260px; }
.chart-box.short { height: 200px; }
.series-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
.series-key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(28,27,28,.45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal header { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 10px; }
.modal header h2 { font-size: 17px; flex: 1; }
.modal .body { padding: 16px 18px; }
.modal footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal footer .spacer { flex: 1; }
.history { font-size: 12px; color: var(--text-2); border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; }
.history div { padding: 2px 0; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--text-3); }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--charcoal); }
.login { background: var(--surface); border-radius: 14px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.login .brand { color: var(--text); margin-bottom: 18px; }
.login h1 { font-size: 20px; margin-bottom: 4px; }
.login p { color: var(--text-2); margin: 0 0 16px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--charcoal); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 80; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 90vw; }
.toast.err { background: var(--bad); }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 9px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
.banner.info { background: var(--info-bg); color: var(--info); }
.req { border-left: 4px solid var(--orange); }
.req .rq-form { display: grid; grid-template-columns: 1.3fr 1fr 1fr .7fr auto auto; gap: 8px; align-items: end; margin-top: 10px; }
@media (max-width: 900px) { .req .rq-form { grid-template-columns: 1fr 1fr; } }
.req .rq-form label { font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; }

/* ---------- Visual layer ---------- */
:root {
  --p1: #2a78d6; --p2: #1baf7a; --p3: #6250d6; --p4: #eda100; --p5: #e87ba4; --p6: #008300;
  --st-overdue: var(--bad); --st-week: #FF8200; --st-later: #8FA3B8; --st-nodate: #D9D6D3; --st-wait: #E0A526;
  --heat-0: var(--surface-2); --heat-1: #FFE7CC; --heat-2: #FFC380; --heat-3: #FF9A33; --heat-4: #C45F00; --heat-ink-4: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --p1: #3987e5; --p2: #199e70; --p3: #9085e9; --p4: #c98500; --p5: #d55181; --p6: #008300;
    --st-later: #6E8399; --st-nodate: #4A474A; --st-wait: #C99320;

async function api(action, payload) {
  const url = API_URL();
  if (!url) throw new Error("The dashboard is not connected yet.");
  S.saving++; paintSync();
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({}, payload || {}, { action, token: S.token })) });
    const out = await res.json();
    if (!out.ok && out.code === "auth") { signOut(out.error); throw new Error(out.error); }
    S.syncErr = false;
    return out;
  } catch (e) {
    if (e instanceof TypeError) { S.syncErr = true; throw new Error("Could not reach the dashboard. Check your connection and try again."); }
    throw e;
  } finally { S.saving--; paintSync(); }
}
async function apiOk(action, payload) {
  const out = await api(action, payload);
  if (!out.ok && out.code !== "conflict") throw new Error(out.error || "Something went wrong.");
  return out;
}

function capacityOn(p, iso) { if (notJoined(p, iso)) return 0; const dow = new Date(iso + "T00:00:00").getDay(); return workingDaysOf(p).indexOf(dow) !== -1 ? n0(p.hoursPerDay || 7.5) : 0; }
function apptHours(a) {
  const m = String(a.time || "").match(/(\d{1,2})[:.]?(\d{2})?\s*(am|pm)?\s*[-–to]+\s*(\d{1,2})[:.]?(\d{2})?\s*(am|pm)?/i);
  if (!m) return a.time ? 1 : 0;
  const h = (hh, mm, ap) => { let x = Number(hh) + Number(mm || 0) / 60; if (ap && /pm/i.test(ap) && x < 12) x += 12; return x; };

function bdFlags(bd) {

}

function ownerBadge(id) { return id ? `<span class="who" style="--pc:var(${pColorVar(id)})" title="${esc(nameOf(id))}">${initials(nameOf(id))}</span>` : `<span class="who none" title="Needs an owner">?</span>`; }
function statusPill(j) {
  const s = j.status;
  const cls = s === "Complete" ? "good" : s === "Cancelled" ? "" : isOverdue(j) ? "bad" : s === "Waiting on others" || s === "On Hold" ? "warn" : s === "In Progress" || s === "Live" ? "info" : "brand";
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

function filteredJobs(ignoreStatus) {
  const f = S.jobs, t = today();
  let list = jobsInScope();
  if (f.quick === "none") list = D().jobs.filter(j => !j.owner && !finished(j));
  if (!ignoreStatus) {
    if (f.status === "open") list = list.filter(j => !finished(j));
    else if (f.status === "done") list = list.filter(finished);
    else if (f.status !== "all") list = list.filter(j => j.status === f.status);
  }
  if (f.ws !== "all") list = list.filter(j => j.workstream === f.ws);
  if (f.cat !== "all") list = list.filter(j => j.category === f.cat);
  if (f.quick === "overdue") list = list.filter(isOverdue);
  if (f.quick === "week") list = list.filter(j => !finished(j) && j.dueDate && j.dueDate >= t && j.dueDate <= addDays(t, 7));
  if (f.quick === "stale") list = list.filter(isStale);
  if (f.quick === "nohours") list = list.filter(j => !finished(j) && !n0(j.estHours) && j.dueDate && j.dueDate >= t && j.dueDate <= addDays(t, 14));
  if (f.quick === "waiting") list = list.filter(j => j.status === "Waiting on others");
  if (f.quick === "nodate") list = list.filter(j => !finished(j) && !j.dueDate);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(j => [j.title, j.description, j.notes, j.campaign, j.platform, j.category].join(" ").toLowerCase().indexOf(q) !== -1); }
  return list;
}

function viewJobs() {
  const admin = me().isAdmin;
  const L = D().lists;
  const f = S.jobs;
  const boardView = f.view === "board";
  const list = filteredJobs(boardView);
  const t = today(), wkEnd = addDays(mondayOf(t), 6), nextEnd = addDays(wkEnd, 7);
  const groups = [
    ["Overdue", j => isOverdue(j)],
    ["Live, ongoing", j => j.status === "Live" && j.dueDate && j.dueDate < t],
    ["This week", j => !finished(j) && j.dueDate && j.dueDate >= t && j.dueDate <= wkEnd],
    ["Next week", j => !finished(j) && j.dueDate && j.dueDate > wkEnd && j.dueDate <= nextEnd],
    ["Later", j => !finished(j) && j.dueDate && j.dueDate > nextEnd],
    ["No due date", j => !finished(j) && !j.dueDate],
    ["Finished", j => finished(j)]
  ];
  const quickLabel = { overdue: "Overdue", week: "Due in 7 days", stale: "Not updated recently", nohours: "No time estimate", waiting: "Waiting on others", none: "Needs an owner", nodate: "No due date" }[f.quick];
  const count = id => { const n = openJobs(id === "all" ? D().jobs : id === "none" ? D().jobs.filter(j => !j.owner) : D().jobs.filter(j => j.owner === id)).length; return `<span class="count">${n}</span>`; };

  let body = "";
  if (boardView) body = boardHtml(list);
  else groups.forEach(([name, test]) => {
    let g = list.filter(test);
    if (!g.length) return;
    g.sort((a, b) => name === "Finished" ? String(b.completedAt || b.dueDate).localeCompare(String(a.completedAt || a.dueDate)) : String(a.dueDate).localeCompare(String(b.dueDate)) || a.title.localeCompare(b.title));
    const cap = name === "Finished" ? 150 : 400;
    body += `<div class="group-title">${name} <span class="n">${g.length}</span>${admin && name !== "Finished" ? `<button class="linkbtn small" data-selgroup="${name}">Select all</button>` : ""}</div>
      <div class="jobs">${g.slice(0, cap).map(jobRow).join("")}</div>
      ${g.length > cap ? `<div class="small muted" style="margin-top:6px">Showing ${cap} of ${g.length}. Use search to narrow it down.</div>` : ""}`;
  });

  return `
  <div class="page-head"><div><h1>${admin ? "Jobs" : "My jobs"}</h1><div class="sub">${admin ? (S.person === "all" ? "Everyone" : S.person === "none" ? "Needs an owner" : nameOf(S.person)) : "Only you can see this list"}</div></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Layout"><button class="${boardView ? "" : "on"}" data-jview="list">${icon("list")} List</button><button class="${boardView ? "on" : ""}" data-jview="board">${icon("board")} Board</button></div>
    <button class="btn" data-act="exportJobs">Export CSV</button>
    <button class="btn primary" data-act="newJob">+ New job</button></div>
  ${personChips({ count, none: true })}
  ${!admin && openJobs(D().jobs).some(isStale) ? `<div class="banner">Some of your jobs haven't been updated in ${D().settings.staleDays} days. A quick status change keeps everyone's view accurate.</div>` : ""}
  <div class="toolbar">
    <input type="search" id="jobSearch" placeholder="Search jobs" value="${esc(f.q)}" aria-label="Search jobs">
    <select id="jobStatus" aria-label="Status" class="${boardView ? "hidden" : ""}"><option value="open">Open jobs</option><option value="all">All jobs</option><option value="done">Finished</option>${L.statuses.map(s => `<option>${esc(s)}</option>`).join("")}</select>
    ${admin ? `<select id="jobWs" aria-label="Workstream"><option value="all">All workstreams</option>${L.workstreams.map(s => `<option>${esc(s)}</option>`).join("")}</select>` : ""}
    <select id="jobCat" aria-label="Category"><option value="all">All categories</option>${L.categories.map(s => `<option>${esc(s)}</option>`).join("")}</select>
    ${quickLabel ? `<span class="pill brand">${quickLabel} <button class="x" style="font-size:15px;color:inherit" data-quick="" aria-label="Clear">×</button></span>` : ""}
    <span class="muted small">${list.length} job${list.length === 1 ? "" : "s"}</span>
  </div>
  ${body || `<div class="card empty">No jobs match these filters.</div>`}
  ${admin && S.sel.size && !boardView ? `<div class="bulkbar"><b>${S.sel.size} selected</b><span>Assign to</span><select id="bulkOwner"><option value="">Choose a person</option>${activePeople().map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><button class="btn sm primary" data-act="bulkAssign">Assign</button><span style="margin-left:8px">or set status</span><select id="bulkStatus"><option value="">Choose a status</option>${L.statuses.map(s => `<option>${esc(s)}</option>`).join("")}</select><button class="btn sm primary" data-act="bulkStatus">Update</button><button class="btn sm" data-act="bulkClear" style="color:var(--text)">Clear</button></div>` : ""}`;
}

const BOARD_COLS = [["Backlog", "--st-nodate"], ["Scheduled", "--st-later"], ["In Progress", "--p1"], ["Waiting on others", "--st-wait"], ["On Hold", "--st-wait"], ["Live", "--p2"], ["Complete", "--good"]];
function boardHtml(list) {
  const cut = addDays(today(), -14);
  return `<p class="note muted" style="margin:-4px 0 10px">Drag a card into another column to change its status. Done shows the last 14 days.</p>
  <div class="board">${BOARD_COLS.map(([st, cv]) => {
    let items = list.filter(j => j.status === st);
    if (st === "Complete") items = items.filter(j => String(j.completedAt || j.updatedAt || "").slice(0, 10) >= cut);
    items.sort((a, b) => String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999")));
    return `<div class="col" data-col="${esc(st)}" aria-label="${esc(st)}"><div class="col-head"><i class="dot" style="--c:var(${cv})"></i>${esc(st === "Complete" ? "Done" : st)}<span class="n">${items.length}</span></div>
      ${items.slice(0, 60).map(kcard).join("") || `<div class="col-empty">Drop jobs here</div>`}
      ${items.length > 60 ? `<div class="small muted">+${items.length - 60} more. Use search to narrow down.</div>` : ""}</div>`;
  }).join("")}</div>`;
}
function kcard(j) {
  const t = today(), over = isOverdue(j), soon = !over && !finished(j) && j.dueDate && j.dueDate <= addDays(t, 7);

    <div class="km">${me().isAdmin ? ownerBadge(j.owner) : ""}<span>${esc(j.category)}</span><span class="spacer"></span>
      ${j.priority === "Urgent" || j.priority === "High" ? `<span class="pill ${j.priority === "Urgent" ? "bad" : "warn"}">${esc(j.priority)}</span>` : ""}
      ${n0(j.estHours) ? `<span>${n0(j.estHours)}h</span>` : ""}
      ${j.dueDate ? `<span class="duechip ${over ? "over" : soon ? "soon" : ""}">${fmtDate(j.dueDate, { day: "numeric", month: "short" })}</span>` : ""}</div>
  </div>`;
}

      translationNeeded: document.getElementById("jTrans").checked ? "Y" : "", translationDocs: v("jTransDocs") };
    if (admin) { payload.owner = v("jOwner"); payload.workstream = v("jWs"); }
    if (lock) { delete payload.title; delete payload.category; }
    const err = localJobCheck(payload);
    if (err) { document.getElementById("jobErr").innerHTML = `<div class="form-error">${esc(err)}</div>`; return; }
    await saveJob(payload, true);
  });
}
function localJobCheck(p) {
  if (p.title !== undefined && !p.title) return "Every job needs a title.";
  if (D().lists.finished.indexOf(p.status) === -1 && !p.dueDate) return "Open jobs need a due date so nothing slips.";
  if (p.estHours && (isNaN(Number(p.estHours)) || Number(p.estHours) < 0)) return "The time estimate should be a number of hours.";
  return "";
}
async function saveJob(payload, fromModal, quiet) {
  try {
    const out = await apiOk("saveJob", { job: payload });
    if (out.code === "conflict") {
      upsertLocal("jobs", out.job);
      toast(out.error, true);
      if (fromModal) { closeModal(); jobModal(out.job); }
      else render();
      return false;
    }
    upsertLocal("jobs", out.job);
    if (fromModal) closeModal();
    if (!quiet) toast(payload.id ? "Saved" : "Job added");
    render();
    return true;
  } catch (e) {
    if (fromModal) document.getElementById("jobErr").innerHTML = `<div class="form-error">${esc(e.message)}</div>`;
    else { toast(e.message, true); render(); }
    return false;
  }
}
function upsertLocal(coll, rec, key) {
  key = key || "id";
  const list = D()[coll];
  const i = list.findIndex(x => x[key] === rec[key]);
  if (i === -1) list.push(rec); else list[i] = rec;
}
function describeChanges(h) {
  if (h.action === "created") return "created";
  if (h.action === "deleted") return "deleted";
  let ch = {};
  try { ch = JSON.parse(h.changes || "{}"); } catch (e) {}
  const names = { owner: "owner", status: "status", dueDate: "due date", workDate: "work date", estHours: "estimate", title: "title", priority: "priority", notes: "notes", description: "description", self: "self rating", manager: "rating", target: "target", progress: "progress" };
  const parts = Object.keys(ch).map(k => {
    const [a, b] = ch[k];
    if (k === "owner") return `owner ${a ? firstName(a) : "none"} → ${b ? firstName(b) : "none"}`;
    if (["status", "dueDate", "workDate", "estHours", "priority", "self", "manager", "target", "progress"].indexOf(k) !== -1) return `${names[k]} ${a || "blank"} → ${b || "blank"}`;
    return (names[k] || k) + " edited";
  });
  return parts.length ? parts.join(", ") : h.action;
}

function skillsFor(pid) {

    .sort((a, b) => n0(a.sort) - n0(b.sort));
}
const hasVal = v => v !== undefined && v !== null && v !== "";
function ratingOf(pid, sid) { return D().ratings.find(r => r.personId === pid && r.skillId === sid) || {}; }
function matrixStats(pid) {
  const sk = skillsFor(pid);
  const rs = sk.map(x => ratingOf(pid, x.id));
  return { total: sk.length, rated: rs.filter(r => hasVal(r.manager)).length, self: rs.filter(r => hasVal(r.self)).length,
    gaps: rs.filter(r => hasVal(r.manager) && hasVal(r.target) && n0(r.manager) < n0(r.target)).length };
}
function matrixProgress(ppl) {

function matrixCard(p) {

function certTimeline(training) {
  const t = today(), start = addDays(t, -90), end = addDays(t, 365), span = daysBetween(start, end);
  const pos = iso => Math.max(0, Math.min(100, daysBetween(start, iso) / span * 100));
  const items = training.filter(r => r.expiryDate && r.expiryDate >= start && r.expiryDate <= end).sort((a, b) => a.expiryDate.localeCompare(b.expiryDate));
  if (!items.length) return `<div class="empty">No renewals in this window.</div>`;
  const months = [];
  const m = new Date(start + "T00:00:00"); m.setDate(1); m.setMonth(m.getMonth() + 1);
  while (isoOf(m) <= end) { months.push(isoOf(m)); m.setMonth(m.getMonth() + 1); }
  const shortT = x => x.length > 24 ? x.slice(0, 22) + "…" : x;
  return `<div class="tablewrap"><div style="min-width:640px">
    <div class="tl">
      <div class="tl-track"></div><div class="tl-past" style="width:${pos(t)}%"></div><div class="tl-today" style="left:${pos(t)}%"></div>
      ${(() => {
        // Lanes: two above the line, two below. Each label takes the first lane where it won't overlap the previous one.
        const LANES = [[40, 64], [4, 64], [80, 64], [104, 64]]; // [label top, stem from/to the track]
        const ends = LANES.map(() => -100);
        return items.map(r => {
          const cv = r.expiryDate < t ? "--bad" : r.expiryDate <= addDays(t, 60) ? "--warn" : "--good";
          const lbl = `${firstName(r.personId)}: ${r.title}, ${r.expiryDate < t ? "expired" : "expires"} ${fmtDay(r.expiryDate)}`;
          const text = `${firstName(r.personId)} · ${shortT(r.title)}`;
          const x = pos(r.expiryDate), half = text.length * 0.33 + 1; // label half-width in % at the timeline's minimum width
          let lane = ends.findIndex(e => e < x - half);
          if (lane < 0) lane = ends.indexOf(Math.min(...ends));
          ends[lane] = x + half;
          const top = [24, 4, 86, 106][lane];
          const stem = top < 60 ? `top:${top + 16}px;height:${53 - top - 16}px` : `top:71px;height:${top - 71}px`;
          return `<span class="tl-stem" style="left:${x}%;${stem}"></span><button class="tl-mk" data-training="${r.id}" style="left:${x}%;--c:var(${cv})" title="${esc(lbl)}" aria-label="${esc(lbl)}"></button><span class="tl-lab" style="left:${x}%;top:${top}px">${esc(text)}</span>`;
        }).join("");
      })()}
    </div>
    <div class="tl-months">${months.map(x => `<span style="left:${pos(x)}%">${fmtDate(x, { month: "short" })}</span>`).join("")}<span class="now" style="left:${pos(t)}%">Today</span></div>
  </div></div>
  <div class="legend"><span><i class="dot" style="--c:var(--good)"></i> In date</span><span><i class="dot" style="--c:var(--warn)"></i> Renew within 60 days</span><span><i class="dot" style="--c:var(--bad)"></i> Expired</span></div>`;
}

const curMonth = () => today().slice(0, 7);
const curQuarter = () => { const [y, m] = today().split("-").map(Number); return `${y}-Q${Math.floor((m - 1) / 3) + 1}`; };
function periodLabel(cad, per) {
  if (cad === "Monthly" && per) return fmtDate(per + "-01", { month: "long", year: "numeric" });
  if (cad === "Quarterly" && per) { const [y, q] = per.split("-Q"); return `Q${q} ${y}`; }
  return "Development";
}
function periodOptions(cad, sel) {
  const out = [];
  if (cad === "Monthly") {
    const d = new Date(curMonth() + "-01T00:00:00"); d.setMonth(d.getMonth() - 2);
    for (let i = 0; i < 9; i++) { const p = isoOf(d).slice(0, 7); out.push([p, periodLabel("Monthly", p)]); d.setMonth(d.getMonth() + 1); }
  } else if (cad === "Quarterly") {
    let [y, q] = curQuarter().split("-Q").map(Number); q -= 1; if (q < 1) { q = 4; y--; }
    for (let i = 0; i < 6; i++) { out.push([`${y}-Q${q}`, periodLabel("Quarterly", `${y}-Q${q}`)]); q++; if (q > 4) { q = 1; y++; } }
  } else return `<option value="">Longer term, no set period</option>`;
  if (sel && !out.some(o => o[0] === sel)) out.unshift([sel, periodLabel(cad, sel)]);
  return out.map(([v, l]) => `<option value="${v}" ${v === sel ? "selected" : ""}>${esc(l)}</option>`).join("");
}
function goalModal(rec) {
  const admin = me().isAdmin;

  if (!g.cadence) g.cadence = "Development";
  if (!g.id && !g.period) g.period = g.cadence === "Monthly" ? curMonth() : g.cadence === "Quarterly" ? curQuarter() : "";
  const lock = !admin && !!g.id;
  openModal(g.id ? "Update goal" : "Add goal", `<div id="mErr"></div>
    <label class="f">Person${personSelect("gPerson", g.personId)}</label>
    <div class="frow"><label class="f">Goal type<select id="gCad" ${lock ? "disabled" : ""}>${[["Monthly", "Monthly"], ["Quarterly", "Quarterly"], ["Development", "Development (longer term)"]].map(([v, l]) => `<option value="${v}" ${v === g.cadence ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f">For<select id="gPer" ${lock || g.cadence === "Development" ? "disabled" : ""}>${periodOptions(g.cadence, g.period)}</select></label></div>
    <label class="f">Goal<input type="text" id="gTitle" value="${esc(g.title || "")}" ${lock ? "readonly" : ""} placeholder="e.g. Publish 8 LinkedIn posts this month"></label>
    <label class="f">What success looks like<textarea id="gDetail" style="min-height:60px" ${lock ? "readonly" : ""}>${esc(g.detail || "")}</textarea></label>
    <div class="frow three"><label class="f">Status<select id="gStatus">${L.goalStatuses.map(x => `<option ${x === g.status ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>
      <label class="f">Progress %<input type="number" id="gProg" min="0" max="100" step="5" value="${esc(g.progress)}"></label>
      <label class="f">Linked skill<select id="gSkill" ${lock ? "disabled" : ""}><option value="">None</option>${skillsFor(g.personId).map(x => `<option value="${x.id}" ${x.id === g.skillId ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label></div>
    <div class="frow"><label class="f">Due (blank: end of the month or quarter)<input type="date" id="gDue" value="${esc(g.dueDate || "")}" ${lock ? "readonly" : ""}></label>
      <label class="f">Next review<input type="date" id="gRev" value="${esc(g.reviewDate || "")}" ${lock ? "readonly" : ""}></label></div>
    <label class="f">Progress notes<textarea id="gNotes">${esc(g.notes || "")}</textarea></label>`,
    `${g.id && admin ? `<button class="btn danger" data-act="deleteGoal" data-id="${g.id}">Remove</button>` : ""}<div class="spacer"></div><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="mSave">Save</button>`);
  const cad = document.getElementById("gCad"), per = document.getElementById("gPer");
  cad.addEventListener("change", () => { per.innerHTML = periodOptions(cad.value, cad.value === "Monthly" ? curMonth() : cad.value === "Quarterly" ? curQuarter() : ""); per.disabled = cad.value === "Development"; });
  document.getElementById("mSave").addEventListener("click", () => saveRecord("saveGoal", "goals", {
    id: g.id, version: g.version, personId: admin ? val("gPerson") : me().id, title: val("gTitle"), detail: val("gDetail"), status: val("gStatus"),
    progress: val("gProg"), skillId: val("gSkill"), dueDate: val("gDue"), reviewDate: val("gRev"), notes: val("gNotes"),
    cadence: cad.value, period: cad.value === "Development" ? "" : per.value }, goalModal));
}

/* =====================================================================

const meetingsOf = pid => (D().meetings || []).filter(m => m.personId === pid).sort((a, b) => String(b.date).localeCompare(String(a.date)));
const meetingActions = m => { try { return JSON.parse(m.actions || "[]"); } catch (e) { return []; } };
function oneOnePeople() { return me().isAdmin ? activePeople().filter(p => p.id !== me().id && (S.person === "all" || S.person === "none" || p.id === S.person)) : people(); }
function oneOnesDue() {
  if (!S.data || !me().isAdmin) return 0;
  const cut = addDays(today(), -7);
  return activePeople().filter(p => p.id !== me().id && !notJoined(p)).filter(p => { const l = meetingsOf(p.id)[0]; return !l || l.date < cut; }).length;
}
function oneOneFlag(pid) {
  if (!me().isAdmin || pid === me().id) return "";
  const pp = personById(pid);
  if (notJoined(pp)) return `<span class="pill info">${icon("week", 13)} ${esc(joinLabel(pp, true))}</span>`;
  const last = meetingsOf(pid)[0];
  if (!last) return `<span class="pill warn">${icon("oneone", 13)} No 1:1 logged</span>`;
  const d = daysBetween(last.date, today());
  return `<span class="pill ${d > 14 ? "bad" : d > 7 ? "warn" : "good"}">${icon("oneone", 13)} 1:1 ${d === 0 ? "today" : d === 1 ? "yesterday" : d + " days ago"}</span>`;
}
function weekDots(pid) {
  const st = addDays(mondayOf(today()), -49), ms = meetingsOf(pid);
  const held = Array.from({ length: 8 }, (_, i) => { const w = addDays(st, i * 7); return [w, ms.some(m => m.date >= w && m.date < addDays(w, 7))]; });
  return `<div class="wkdots" role="img" aria-label="1:1s held in ${held.filter(h => h[1]).length} of the last 8 weeks">${held.map(([w, hit], i) => `<i class="${hit ? "on" : ""} ${i === 7 ? "cur" : ""}" title="w/c ${fmtDate(w, { day: "numeric", month: "short" })}: ${hit ? "1:1 held" : "no 1:1"}"></i>`).join("")}<span class="small muted">last 8 weeks</span></div>`;
}
function goalColor(g) { return g.status === "Done" ? "--good" : g.status === "At risk" ? "--st-wait" : g.status === "On track" ? "--p1" : "--st-later"; }
function goalMini(g) {
  const late = g.status !== "Done" && g.dueDate && g.dueDate < today();
  return `<button class="gmini" data-goal="${g.id}">${ring(n0(g.progress), 46, goalColor(g), "Progress")}<span><b>${esc(g.title)}</b><small>${esc(g.status)}${late ? " · past due" : g.dueDate ? " · due " + fmtDate(g.dueDate, { day: "numeric", month: "short" }) : ""}</small></span></button>`;
}
function viewOneOne() {
  const admin = me().isAdmin;
  const ppl = oneOnePeople();
  return `<div class="page-head"><div><h1>${admin ? "1:1s & goals" : "My 1:1s & goals"}</h1><div class="sub">${admin ? "Weekly 1:1s, actions agreed, and monthly, quarterly and development goals" : "Your 1:1 notes, actions and goals. Only you and Kayleigh can see this."}</div></div></div>
  ${admin ? personChips({ filter: p => p.id !== me().id }) : ""}
  ${ppl.length ? ppl.map(oneOneSection).join("") : `<div class="card empty">No team members to show.</div>`}`;
}
function oneOneSection(p) {
  const admin = me().isAdmin, t = today();
  const ms = meetingsOf(p.id), last = ms[0];
  const days = last ? daysBetween(last.date, t) : null;
  const status = notJoined(p) ? `<span class="pill info">${esc(joinLabel(p))}</span>`
    : !admin ? (last && last.nextDate ? `<span class="pill info">Next 1:1 ${fmtDate(last.nextDate)}</span>` : "")
    : !last ? `<span class="pill warn">No 1:1 logged yet</span>`
    : days > 14 ? `<span class="pill bad">Last 1:1 ${days} days ago</span>`
    : days > 7 ? `<span class="pill warn">1:1 due · last ${days} days ago</span>`
    : `<span class="pill good">Last 1:1 ${days === 0 ? "today" : days === 1 ? "yesterday" : days + " days ago"}</span>`;
  const goals = D().goals.filter(g => g.personId === p.id);
  const col = (cad, title, per) => {
    const gs = goals.filter(g => (g.cadence || "Development") === cad && (cad === "Development" || g.period === per))
      .sort((a, b) => (a.status === "Done") - (b.status === "Done"));
    const avg = gs.length ? gs.reduce((x, g) => x + n0(g.progress), 0) / gs.length : 0;
    return `<div class="gcol"><div class="gcol-head"><b>${title}</b><span class="muted small">${cad === "Development" ? "Longer term" : esc(periodLabel(cad, per))}</span>${gs.length ? `<span class="small muted">· ${Math.round(avg)}% avg</span>` : ""}${admin ? `<button class="linkbtn small" data-newgoal="${p.id}|${cad}|${per}">+ Add</button>` : ""}</div>
      ${gs.length ? gs.map(goalMini).join("") : `<div class="col-empty">No ${cad === "Development" ? "development" : cad.toLowerCase()} goals${admin ? " yet" : ""}</div>`}</div>`;
  };
  const agenda = (D().agenda || []).filter(a => a.personId === p.id && !a.meetingId);
  return `<div class="card section oneone">
    <div class="card-head" style="flex-wrap:wrap;gap:10px">
      <span class="who" style="--pc:var(${pColorVar(p.id)});width:36px;height:36px;font-size:12.5px">${initials(p.name)}</span>
      <div><h2 style="margin:0;font-size:16px">${esc(p.name)}</h2><div class="small muted">${esc(p.team || "")}</div></div>
      ${weekDots(p.id)} ${status}
      <div class="spacer"></div>${admin ? `<button class="btn primary sm" data-logmeeting="${p.id}">+ Log 1:1</button>` : ""}
    </div>
    ${notJoined(p) && admin ? `<p class="note" style="margin:6px 0 0">${esc(p.name.split(" ")[0])} isn't on the team yet, so 1:1 reminders start from the joining date. You can set up goals, topics and the skills matrix now.</p>` : ""}
    <div class="grid g-3" style="margin-top:8px">${col("Monthly", "This month", curMonth())}${col("Quarterly", "This quarter", curQuarter())}${col("Development", "Development", "")}</div>
    <div class="grid g-2" style="margin-top:16px">
      <div><h3 class="subh">For the next 1:1</h3>
        ${agenda.length ? `<ul class="agenda">${agenda.map(a => `<li><span>${esc(a.text)}</span><small class="muted">${esc(a.addedBy === me().id ? "you" : firstName(a.addedBy))}, ${esc(ago(a.createdAt))}</small>${admin || a.personId === me().id ? `<button class="x" data-delagenda="${a.id}" aria-label="Remove topic">×</button>` : ""}</li>`).join("")}</ul>` : `<p class="note">Nothing added yet.</p>`}
        <div class="agenda-add"><input type="text" id="ag_${p.id}" placeholder="${admin ? "Add a topic for the next 1:1" : "Something you want to talk about"}" maxlength="300" aria-label="New topic"><button class="btn sm" data-addagenda="${p.id}">Add</button></div>
      </div>
      <div><h3 class="subh">Recent 1:1s</h3>
        ${ms.length ? `<ul class="mlist">${ms.slice(0, 5).map(meetingRow).join("")}</ul>${ms.length > 5 ? `<div class="small muted" style="margin-top:6px">+${ms.length - 5} earlier</div>` : ""}` : `<p class="note">No 1:1s logged yet.</p>`}
      </div>
    </div>
  </div>`;
}
function meetingRow(m) {
  const jobs = meetingActions(m).map(a => D().jobs.find(j => j.id === a.jobId)).filter(Boolean);
  const done = jobs.filter(finished).length;
  return `<li><button class="mrow" data-meeting="${m.id}"><span class="mdate">${fmtDate(m.date, { day: "numeric", month: "short" })}</span><span class="msum">${esc(String(m.sharedNotes || "No notes").split("\n")[0].slice(0, 110))}</span>${jobs.length ? `<span class="pill ${done === jobs.length ? "good" : "brand"}">${done}/${jobs.length} actions done</span>` : ""}</button></li>`;
}
function meetingModal(pid, m) {

    ${goals.length ? `<div class="f-group"><div class="f-lab">Goal check-in</div><div class="tablewrap"><table class="t"><tbody>${goals.map(g => `<tr><td><b>${esc(g.title)}</b><div class="small muted">${esc(periodLabel(g.cadence || "Development", g.period))}</div></td><td style="width:150px"><select data-gst="${g.id}" aria-label="Status">${D().lists.goalStatuses.map(x => `<option ${x === g.status ? "selected" : ""}>${x}</option>`).join("")}</select></td><td style="width:86px"><input type="number" min="0" max="100" step="5" data-gpr="${g.id}" value="${n0(g.progress)}" aria-label="Progress %"></td></tr>`).join("")}</tbody></table></div></div>` : ""}
    <label class="f">Notes ${esc(firstName(m.personId))} can see<textarea id="mtShared" placeholder="What you talked about, wins, blockers">${esc(m.sharedNotes || "")}</textarea></label>

/* ---------- Workload history: every past job, week by week ---------- */
function jobHours(j) {

}
function historyWeeks() {
  const cur = mondayOf(today());
  const dates = D().jobs.map(j => j.workDate || j.dueDate).filter(Boolean).filter(d => d <= addDays(cur, 6)).sort();
  let first = dates.length ? mondayOf(dates[0]) : cur;
  const range = S.histRange || "all";
  const back = range === "12w" ? 11 : range === "6m" ? 25 : 51;
  const floor = addDays(cur, -7 * back);

  const out = []; for (let w = first; w <= cur; w = addDays(w, 7)) out.push(w);

}
function weekLoad(pid, w) {

  let hours = 0, est = 0;

  if (pid) (D().appointments || []).filter(a => a.date >= w && a.date < end && a.people.indexOf(pid) !== -1 && !notJoined(personById(pid), a.date)).forEach(a => { hours += apptHours(a); });

function historyStats(ppl, weeks) {

    const hours = per.reduce((x, r) => x + r.hours, 0) + un.hours;

}

function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = () => res(window.XLSX); sc.onerror = () => rej(new Error("Couldn't load the Excel reader. Save the report as CSV and try again.")); document.head.appendChild(sc); });
}
async function handleSocialFile(file) {
  if (!file) return;
  try {
    let rows;
    if (/\.csv$/i.test(file.name)) rows = parseCsv(await file.text());
    else if (/\.xlsx?$/i.test(file.name)) {
      const X = await loadXLSX();
      const buf = await file.arrayBuffer();
      // HubSpot's files make the Excel reader log harmless size warnings; keep the console quiet while reading.
      const ce = console.error; console.error = () => {};
      let wb; try { wb = X.read(buf, { type: "array" }); } finally { console.error = ce; }
      const name = wb.SheetNames.find(n => /export all|all/i.test(n)) || wb.SheetNames[0];
      rows = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: "" });
    } else throw new Error("Choose an Excel (.xlsx) or CSV file.");
    toast("Reading " + file.name);
    const out = await apiOk("importSocialRows", { rows, source: file.name.replace(/\.(xlsx?|csv)$/i, "") });
    if (!out.ok) throw new Error(out.error);
    await load(true);
    toast(out.kind === "daily" ? `${out.network} daily totals: ${out.added} day${out.added === 1 ? "" : "s"} added, ${out.updated} updated` : `${out.added} new post${out.added === 1 ? "" : "s"} added, ${out.updated} updated${out.skipped ? `, ${out.skipped} skipped` : ""}`);
  } catch (e) { toast(e.message, true); }
}

/* CSV upload for socials (admin) */
function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.join("").trim());
}
function pickFile(accept) {
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = accept; i.onchange = () => res(i.files[0]); i.click(); });
}

function openModal(title, body, foot) {
  closeModal();
  S.modalOpen = true;
  const o = document.createElement("div");
  o.className = "overlay"; o.id = "overlay";
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Close">×</button></header><div class="body">${body}</div><footer>${foot}</footer></div>`;
  o.addEventListener("mousedown", e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
  const first = o.querySelector("input:not([readonly]),select,textarea");
  if (first) first.focus();
}
function closeModal() { const o = document.getElementById("overlay"); if (o) o.remove(); S.modalOpen = false; }

function destroyCharts() { S.charts.forEach(c => c.destroy()); S.charts = []; }
function chartBase(unit) {
  const grid = cssVar("--line"), ink = cssVar("--text-2");
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: { legend: { display: false }, tooltip: { backgroundColor: cssVar("--charcoal"), padding: 10, callbacks: { label: c => ` ${c.dataset.label}: ${unit === "£" ? "£" : ""}${c.formattedValue}${unit === "%" ? "%" : ""}` } } },
    scales: {
      x: { grid: { display: false }, ticks: { color: ink, font: { family: cssVar("--font"), size: 11 }, maxRotation: 0, autoSkip: true } },
      y: { beginAtZero: true, grid: { color: grid }, border: { display: false }, ticks: { color: ink, precision: unit === "%" ? 1 : 0, font: { size: 11 }, callback: v => unit === "£" ? "£" + Number(v).toLocaleString("en-GB") : unit === "%" ? v + "%" : v } }
    }
  };
}
function barChart(id, labels, series, unit, horizontal, extra) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  const opts = chartBase(unit);
  if (extra && extra.max) opts.scales.y.max = extra.max;
  if (horizontal) { opts.indexAxis = "y"; const x = opts.scales.x; opts.scales.x = opts.scales.y; opts.scales.y = x; opts.scales.y.grid = { display: false }; }
  S.charts.push(new Chart(el, { type: "bar", data: { labels, datasets: series.map(s => ({ label: s.label, data: s.data, backgroundColor: s.color, borderRadius: 4, borderSkipped: "start", maxBarThickness: 28, borderColor: cssVar("--surface"), borderWidth: 1 })) }, options: opts }));
}
function lineChart(id, labels, series, unit) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  const opts = chartBase(unit);
  S.charts.push(new Chart(el, { type: "line", data: { labels, datasets: series.map(s => ({ label: s.label, data: s.data, borderColor: s.color, backgroundColor: s.color, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 12, tension: 0, spanGaps: true })) }, options: opts }));
}
function stackedChart(id, labels, series, o) {
  const el = document.getElementById(id); if (!el || !window.Chart) return null;
  o = o || {};
  const opts = chartBase(o.unit);
  if (o.horizontal) { opts.indexAxis = "y"; const x = opts.scales.x; opts.scales.x = opts.scales.y; opts.scales.y = x; opts.scales.y.grid = { display: false }; }
  opts.scales.x.stacked = true; opts.scales.y.stacked = true;
  if (o.onClick) { opts.onClick = o.onClick; opts.onHover = (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; }; }
  const ch = new Chart(el, { type: "bar", data: { labels, datasets: series.map(s => ({ label: s.label, data: s.data, backgroundColor: s.color, borderColor: cssVar("--surface"), borderWidth: 1.5, borderRadius: 4, borderSkipped: false, maxBarThickness: o.horizontal ? 24 : 28 })) }, options: opts });
  S.charts.push(ch);
  return ch;
}

document.addEventListener("click", async e => {
  if (S.menuOpen && !e.target.closest(".acct")) { S.menuOpen = false; render(); }

  const el = e.target.closest("[data-tooledit],[data-toolcode],[data-copy],[data-tick],[data-untick],[data-star],[data-plan],[data-qadue],[data-qahours],[data-tab],[data-person],[data-act],[data-job],[data-kjob],[data-jview],[data-hist],[data-histweek],[data-logmeeting],[data-meeting],[data-addagenda],[data-delagenda],[data-newgoal],[data-supportjob],[data-quick],[data-training],[data-goal],[data-rate],[data-sdays],[data-snet],[data-awho],[data-editperson],[data-setpass],[data-capday],[data-selgroup]");

  const ds = el.dataset;
  if (ds.tab) { S.tab = ds.tab; LS.set("zcd_tab", ds.tab); S.sel.clear(); render(); window.scrollTo(0, 0); return; }
  if (ds.person && !el.closest(".overlay")) {
    S.person = ds.person; LS.set("zcd_person", ds.person);
    if (el.classList.contains("pcard")) { S.tab = "jobs"; S.jobs.quick = ""; }
    if (ds.person !== "none" && S.jobs.quick === "none") S.jobs.quick = "";
    if (ds.person === "none") { S.jobs.quick = "none"; }
    render(); return;
  }
  if (ds.quick !== undefined) {
    S.jobs.quick = ds.quick; S.jobs.status = "open";
    if (ds.quick === "none") S.person = "none";
    if (S.tab !== "jobs") { S.tab = "jobs"; LS.set("zcd_tab", "jobs"); }
    closeModal(); render(); return;
  }
  if (ds.job) { const j = D().jobs.find(x => x.id === ds.job); if (j) jobModal(j); return; }
  if (ds.kjob) { const j = D().jobs.find(x => x.id === ds.kjob); if (j) jobModal(j); return; }

  if (ds.copy) {
    const pre = document.getElementById(ds.copy); if (!pre) return;

    return;
  }
  if (ds.tick) {
    const j = D().jobs.find(x => x.id === ds.tick); if (!j) return;
    const row = el.closest(".todo");
    const wait = celebrate(row);
    if (wait) await new Promise(r => setTimeout(r, wait));
    if (row) row.classList.add("ticking");
    await new Promise(r => setTimeout(r, 220));

      render(); skillsListModal(pid);
    }
    else if (act === "refreshBD") { toast("Fetching from HubSpot. This can take a minute."); const out = await apiOk("refreshBD"); D().bd = out.bd; render(); toast("HubSpot data updated"); }
    else if (act === "checkSocialEmail") { toast("Checking your inbox for HubSpot reports"); const out = await apiOk("refreshSocials"); await load(true); toast(out.emails ? `Imported ${out.added} new and ${out.updated} updated rows` : (out.errors && out.errors.length ? out.errors[0] : "No new report emails found"), !!(out.errors && out.errors.length && !out.emails)); }
    else if (act === "importSocialCsv") { const f = await pickFile(".xlsx,.xls,.csv"); if (f) await handleSocialFile(f); }
    else if (act === "migrateItems") { const out = await apiOk("migrateItems"); if (!out.ok) throw new Error(out.error); await load(true); toast(`Copied ${out.created} jobs. ${out.unowned} need an owner.`); }
    else if (act === "importLegacy") {
      const file = await pickFile(".json,application/json"); if (!file) return;
      const out = await apiOk("importLegacy", { data: JSON.parse(await file.text()) });
      await load(true); toast(`Imported ${out.jobs} events and ideas${out.socials ? `, ${out.socials.added} social posts` : ""}`);
    }
    else if (act === "addPerson") personModal();
  } catch (err) { toast(err.message, true); }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.status) {
    const j = D().jobs.find(x => x.id === t.dataset.status);
    if (!j) return;
    const payload = { id: j.id, version: j.version, status: t.value };
    if (D().lists.finished.indexOf(t.value) === -1 && !j.dueDate) { toast("Open the job and add a due date first.", true); t.value = j.status; return; }
    saveJob(payload, false);
  }
  if (t.dataset.check !== undefined) {
    const i = Number(t.dataset.check); let d = checksDone();
    d = t.checked ? d.concat(i).filter((v, k, a) => a.indexOf(v) === k) : d.filter(v => v !== i);
    LS.set(ckDayKey(), JSON.stringify(d)); render(); return;
  }
  if (t.id === "qaDate") { S.qa.date = t.value; return; }
  if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); render(); }
  if (t.id === "jobStatus") { S.jobs.status = t.value; render(); }
  if (t.id === "jobWs") { S.jobs.ws = t.value; render(); }
  if (t.id === "jobCat") { S.jobs.cat = t.value; render(); }
});
// Board drag and drop
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest(".kcard"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.kjob); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); });
document.addEventListener("dragend", e => { const c = e.target.closest && e.target.closest(".kcard"); if (c) c.classList.remove("dragging"); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest(".col"); if (!col) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => { if (x !== col) x.classList.remove("over"); }); col.classList.add("over"); });
document.addEventListener("drop", async e => {
  const col = e.target.closest && e.target.closest(".col"); if (!col) return;
  e.preventDefault(); col.classList.remove("over");
  const id = e.dataTransfer.getData("text/plain");
  const j = D().jobs.find(x => x.id === id); const st = col.dataset.col;
  if (!j || j.status === st) return;
  if (D().lists.finished.indexOf(st) === -1 && !j.dueDate) { toast("Open the job and add a due date first.", true); return; }
  const prev = j.status;
  j.status = st; render();
  const ok = await saveJob({ id: j.id, version: j.version, status: st }, false);
  if (!ok && D().jobs.find(x => x.id === id) === j) { j.status = prev; render(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "qaForm") return;
  e.preventDefault();
  const title = val("qaTitle");
  if (!title) { toast("Type what needs doing first.", true); return; }
  const due = qaDueDate();
  const ok = await saveJob({ title, owner: me().id, dueDate: due, workDate: S.qa.due === "today" ? today() : "", status: "Scheduled", category: "Job", priority: "Standard", estHours: S.qa.hours }, false, true);
  if (ok) { toast(`Added for ${due === today() ? "today" : fmtDate(due, { weekday: "long", day: "numeric", month: "short" })}`); const q = document.getElementById("qaTitle"); if (q) q.focus(); }
});
let searchTimer;
document.addEventListener("input", e => {
  if (e.target.id === "jobSearch") {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { S.jobs.q = e.target.value; render(); const s = document.getElementById("jobSearch"); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.menuOpen) { S.menuOpen = false; render(); }
  if (e.key === "Escape" && S.modalOpen) closeModal();
  if (e.key === "Enter" && e.target.id && e.target.id.indexOf("ag_") === 0) { const b = document.querySelector(`[data-addagenda="${e.target.id.slice(3)}"]`); if (b) b.click(); }
  if (e.key === "Enter" && e.target.classList && (e.target.classList.contains("pcard") || e.target.classList.contains("kcard") || e.target.classList.contains("stat") || e.target.classList.contains("rate-row"))) e.target.click();
});

// Keep everyone's view current: refresh every 2 minutes while the tab is visible.
setInterval(() => { if (S.token && S.data && document.visibilityState === "visible" && !S.saving && !S.modalOpen && !S.sel.size) load(true); }, 120000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token && S.data && S.lastSync && Date.now() - S.lastSync > 60000 && !S.modalOpen) load(true); });

// Start
(function init() {
  const th = LS.get("zcd_theme", ""); if (th) document.documentElement.dataset.theme = th;
  if (S.token && API_URL()) { document.getElementById("app").innerHTML = `<div class="login-wrap"><div class="login"><p>Loading your dashboard...</p></div></div>`; load().then(() => { if (!S.data) renderLogin(); }); }
  else renderLogin();
})();
</script>
</body>
</html>
